[project]
name = "empathic-ai-therapy-backend-api"
version = "0.1.0"
description = "FastAPI + Hume EVI + Gemini + Neo4j backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "neo4j",
  "google-cloud-aiplatform>=1.38.0",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
